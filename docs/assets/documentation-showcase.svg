<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MBI Signal Logger documentation showcase</title>
  <desc id="desc">A visual map connecting the Public, Field and Admin applications to the architecture, API, deployment and operations documentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182d"/>
      <stop offset="1" stop-color="#103b68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00152b" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="150" fill="#1d7be8" opacity="0.13"/>
  <circle cx="90" cy="580" r="180" fill="#27b47e" opacity="0.10"/>
  <text x="70" y="76" fill="#ffffff" font-family="Arial, sans-serif" font-size="40" font-weight="700">MBI Signal Logger</text>
  <text x="70" y="112" fill="#b9d9ff" font-family="Arial, sans-serif" font-size="20">Project documentation and implementation map</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="310" height="142" rx="18" fill="#ffffff"/>
    <rect x="445" y="160" width="310" height="142" rx="18" fill="#ffffff"/>
    <rect x="820" y="160" width="310" height="142" rx="18" fill="#ffffff"/>
  </g>
  <circle cx="118" cy="208" r="26" fill="#eaf4ff"/>
  <circle cx="493" cy="208" r="26" fill="#eaf4ff"/>
  <circle cx="868" cy="208" r="26" fill="#eaf4ff"/>
  <text x="107" y="217" font-family="Arial, sans-serif" font-size="24">●</text>
  <text x="482" y="217" font-family="Arial, sans-serif" font-size="24">◆</text>
  <text x="857" y="217" font-family="Arial, sans-serif" font-size="24">■</text>
  <text x="158" y="205" fill="#10243e" font-family="Arial, sans-serif" font-size="24" font-weight="700">Public Logger</text>
  <text x="158" y="237" fill="#5d6b7a" font-family="Arial, sans-serif" font-size="17">Listener reports</text>
  <text x="158" y="268" fill="#0b63ce" font-family="Arial, sans-serif" font-size="16" font-weight="700">Route: /</text>
  <text x="533" y="205" fill="#10243e" font-family="Arial, sans-serif" font-size="24" font-weight="700">Field Logger</text>
  <text x="533" y="237" fill="#5d6b7a" font-family="Arial, sans-serif" font-size="17">GPS and RF observations</text>
  <text x="533" y="268" fill="#0b63ce" font-family="Arial, sans-serif" font-size="16" font-weight="700">Route: /field/</text>
  <text x="908" y="205" fill="#10243e" font-family="Arial, sans-serif" font-size="24" font-weight="700">Admin Center</text>
  <text x="908" y="237" fill="#5d6b7a" font-family="Arial, sans-serif" font-size="17">Analysis and operations</text>
  <text x="908" y="268" fill="#0b63ce" font-family="Arial, sans-serif" font-size="16" font-weight="700">Route: /admin/</text>

  <path d="M225 320 V365 H600" stroke="#63b3ff" stroke-width="4" fill="none"/>
  <path d="M600 320 V365" stroke="#63b3ff" stroke-width="4" fill="none"/>
  <path d="M975 320 V365 H600" stroke="#63b3ff" stroke-width="4" fill="none"/>
  <circle cx="600" cy="365" r="8" fill="#63b3ff"/>

  <g filter="url(#shadow)">
    <rect x="150" y="398" width="900" height="150" rx="20" fill="#0d2745" stroke="#4aa3ff" stroke-width="2"/>
  </g>
  <text x="600" y="438" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Documentation Suite</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#d9ecff">
    <text x="210" y="484">Architecture</text>
    <text x="410" y="484">API reference</text>
    <text x="615" y="484">Data model</text>
    <text x="800" y="484">Deployment</text>
    <text x="315" y="522">Operations</text>
    <text x="530" y="522">Release history</text>
    <text x="755" y="522">PDF manuals</text>
  </g>
  <text x="600" y="594" fill="#8fc9ff" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">README landing page - linked technical guides - public-safe examples</text>
</svg>
