    async function refreshRfEstimate(){

        if(draft){draft.strength='';draft.unit='dBµV/m'}

        return null;
      }
      const seq=++rfEstimateSeq;
      rfEstimate={...rfEstimate,status:'loading'};
      updateRfEstimateDisplay();
      try{
        const data=await api('/rf-estimate',{method:'POST',body:{siteId:stationId(station),siteName:station,lat,lon}});
        if(seq!==rfEstimateSeq)return null;
        const ss=data?.signalStrength;

          distanceKm:Number(data.distanceFromStationKm),
          method:ss.method||data?.rfEstimation?.method||'ITU-R P.525 free-space reference',

    }

    function render(){normalizeDraft();renderNav();updateNoticeBadge();let html;switch(view){case'new':html=renderNew();break;case'dashboard':html=enabled('fieldDashboard')?renderUnifiedDashboard():disabledFeature('Field Dashboard');break;case'history':html=renderHistory();break;case'map':html=enabled('liveMap')?renderMap():disabledFeature('Live Map');break;case'sync':html=enabled('syncStatus')?renderSync():disabledFeature('Sync Status');break;case'reports':html=enabled('reports')?renderReports():disabledFeature('Reports');break;case'offline':html=enabled('offlineData')?renderOffline():disabledFeature('Offline Data');break;case'settings':html=enabled('settings')?renderSettings():disabledFeature('Settings');break;case'help':html=enabled('help')?renderHelp():disabledFeature('Help & Support');break;case'about':html=enabled('about')?renderAbout():disabledFeature('About');break;case'more':{const next=visibleMenu().find(m=>!['new','history','map'].includes(m.id));view=next?.id||'new';return render()}default:html=renderCustomView()}if(['new','history','map','sync','reports','offline','settings','help','about'].includes(view))html=menuBanner()+html;document.getElementById('main').innerHTML=html;if(view==='dashboard')applyDashboardLayout();applyFeatureVisibility();bindView();UnifiedUI.bindThemeButtons();if(view==='new'){updateRfEstimateDisplay();scheduleRfEstimate(50)}window.scrollTo({top:0,behavior:'smooth'})}
    function applyDashboardLayout(){const main=document.getElementById('main'),elements={kpis:main.querySelector('.dashboard-kpis'),charts:main.querySelector('.dashboard-analysis'),operations:main.querySelector('.dashboard-operations'),metrics:main.querySelector('.dashboard-metrics')},defaults=DEFAULT_CONFIG.dashboards.field;for(const widget of UnifiedUI.dashboardWidgets(config,'field',defaults)){const element=elements[widget.id];if(!element)continue;const wrapper=document.createElement('section');wrapper.className=`dashboard-widget dashboard-size-${widget.size||'full'}`;wrapper.dataset.widget=widget.id;wrapper.innerHTML=`<h2 class="dashboard-widget-title">${esc(widget.title||widget.id)}</h2>`;wrapper.appendChild(element);main.appendChild(wrapper)}Object.values(elements).forEach(element=>{if(element&&!element.closest('.dashboard-widget'))element.remove()})}
    function saveDraft(){document.querySelectorAll('.draft-input').forEach(el=>draft[el.dataset.key]=el.value);document.querySelectorAll('.custom-input').forEach(el=>draft.custom[el.dataset.custom]=el.type==='checkbox'?el.checked:el.value);rememberFieldContext(draft)}
    function bindView(){document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',e=>{let v=e.currentTarget.dataset.view;if(v){if(view==='new')saveDraft();if(v==='more')v=visibleMenu().find(m=>!['new','history','map'].includes(m.id))?.id||'new';if(v==='map')mapTarget=null;view=v;toggleSidebar(false);render()}}));document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>selectSegment(b.dataset.group,b.dataset.value)));document.querySelectorAll('.draft-input').forEach(el=>{const update=()=>{draft[el.dataset.key]=el.value;if(['engineer','station','channel'].includes(el.dataset.key))rememberFieldContext(draft);if(el.id==='comment')document.getElementById('counter').textContent=el.value.length+'/250';if(el.dataset.key==='station')scheduleRfEstimate(40)};el.addEventListener('input',update);if(el.tagName==='SELECT')el.addEventListener('change',update)});document.querySelectorAll('.custom-input').forEach(el=>el.addEventListener('change',()=>draft.custom[el.dataset.custom]=el.type==='checkbox'?el.checked:el.value));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,b)));document.getElementById('submitIncident')?.addEventListener('click',submitIncident);document.getElementById('dashboardSource')?.addEventListener('change',e=>{dashboardFilter.source=e.target.value;render()});document.getElementById('dashboardStatus')?.addEventListener('change',e=>{dashboardFilter.status=e.target.value;render()});document.getElementById('historySearch')?.addEventListener('input',e=>{historyFilter.q=e.target.value;const pos=e.target.selectionStart;render();requestAnimationFrame(()=>{const n=document.getElementById('historySearch');n?.focus();n?.setSelectionRange(pos,pos)})});document.getElementById('historySource')?.addEventListener('change',e=>{historyFilter.source=e.target.value;render()});document.getElementById('historyStatus')?.addEventListener('change',e=>{historyFilter.status=e.target.     function selectSegment(group,value){saveDraft();const key={signalQuality:'quality',signalStability:'stability',serviceCondition:'service',priority:'priority'}[group];if(key)draft[key]=value;document.querySelectorAll(`[data-group="${group}"]`).forEach(b=>b.classList.toggle('selected',b.dataset.value===value));if(group!=='priority'&&draft.priority==='Auto'||group==='priority'){const note=document.getElementById('priorityNote');if(note)note.textContent=`Priority: ${draft.priority==='Auto'?calculatedPriority():draft.priority}. ${draft.priority==='Auto'?'Calculated automatically.':'Manual priority selected.'}`}}
    function action(name,el){if(name==='sync')syncAll();else if(name==='refresh-dashboard')refreshIncidents(true).then(()=>toast('Combined dashboard refreshed.','success'));else if(name==='sync-one')syncOne(el.dataset.id);else if(name==='export')exportCsv(view==='history'?filteredHistory():incidents,'incident-history');else if(name==='export-report')exportCsv(reportRows(),'incident-report');else if(name==='print')window.print();else if(name==='detail')showDetail(el.dataset.id);else if(name==='focus-map'){const incident=incidents.find(x=>x.id===el.dataset.id),target=incidentMapTarget(incident);if(target)syncMapTargetUi(target,'Map centered on incident.')}else if(name==='recenter'){const target=deviceMapTarget();if(target)syncMapTargetUi(target,'Map centered on current device location.');else toast('Current device location is not available yet.','error')}else if(name==='capture-map')captureGPS(true).then(()=>{if(view==='map'){mapTarget=deviceMapTarget();render()}});else if(name==='calendar-history')openCalendar(historyFilter.date,d=>{historyFilter.date=d;render()});else if(name==='calendar-from')openCalendar(reportFilter.from,d=>{reportFilter.from=d;render()});else if(name==='calendar-to')openCalendar(reportFilter.to,d=>{reportFilter.to=d;render()});else if(name==='clear-report'){reportFilter={from:'',to:''};render()}else if(name==='dark'){UnifiedUI.toggleMode();render();toast('Dark mode preference saved on this device.','success')}else if(name==='bottom-nav'){config.settings.showBottomNav=config.settings.showBottomNav===false;render();toast('Bottom navigation changed for this session.','success')}else if(name==='auto-sync'){config.settings.autoSync=config.settings.autoSync===false;render();toast('Auto-sync preference changed for this session.','success')}}
    function captureGPS(announce=false){coords={...coords,status:'requesting',error:''};updateGpsTelemetry();return new Promise(resolve=>{if(!navigator.geolocation){const result=applyGpsError({code:0,message:'Geolocation is not supported by this browser.'});if(announce)toast(result.error,'error');return resolve(result)}navigator.geolocation.getCurrentPosition(p=>{const result=applyGpsPosition(p);if(announce)toast('GPS location captured.','success');resolve(result)},err=>{const result=applyGpsError(err);if(announce)toast(result.error,'error');resolve(result)},{enableHighAccuracy:config.gps.highAccuracy!==false,timeout:Number(config.gps.timeout)||10000,maximumAge:0})})}
    async function submitIncident(){
      saveDraft();
      const coreRequired=[['engineer','Engineer / Operator'],['station','Station'],['quality','Signal Quality'],['stability','Signal Stability'],['service','Service Condition']];
      const missingCore=coreRequired.find(([key])=>draft[key]==null||String(draft[key]).trim()==='');
      if(missingCore){toast(`Complete required field: ${missingCore[1]}`,'error');return}
      const missing=(config.customFields||[]).filter(f=>{if(f.enabled===false||!f.required)return false;const value=draft.custom[f.id];return value==null||(typeof value==='string'&&!value.trim())});
      if(missing.length){toast('Complete required field: '+missing[0].label,'error');return}
      if(!navigator.onLine){toast('Central storage is unavailable while offline. Reconnect before submitting.','error');return}
      const btn=document.getElementById('submitIncident');if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> CAPTURING GPS…'}
      try{
        const fix=await captureGPS(false);if(config.gps.required&&!fix.ok){toast('A fresh GPS lock is required. Allow location access for this site and try again.','error');return}
        await refreshRfEstimate();
        const now=new Date(),priority=draft.priority==='Auto'?calculatedPriority():draft.priority;
        pendingSubmissionKey||=newSubmissionKey();
        const payload={submissionKey:pendingSubmissionKey,datetime:now.toISOString(),reportType:'engineer',measurementSource:'measured',siteId:stationId(draft.station),siteName:draft.station||config.stations[0]||'',channel:draft.channel||'',strength:String(rfEstimate.value??''),unit:'dBµV/m',signalStrengthSource:'estimated',quality:draft.quality,stability:draft.stability,service:draft.service,severity:priority,ber:draft.ber,mer:draft.mer,snr:draft.snr,noise:draft.noise,comment:draft.comment,operator:draft.engineer.trim(),status:draft.status,lat:coords.lat,lon:coords.lng,accuracy:coords.accuracy,savedBy:'Field Logger',customFields:{...draft.custom}};
        const result=await api('/incidents',{method:'POST',body:payload});pendingSubmissionKey='';await refreshIncidents(false);broadcastState('FIELD_INCIDENT_CHANGED');toast(`${result.id} logged successfully.`,'success');initDraft();render();
      }catch(e){toast(`Incident was not saved: ${e.message}`,'error')}
      finally{const current=document.getElementById('submitIncident');if(current){current.disabled=false;current.innerHTML=`<i class="fa-solid fa-location-dot"></i> ${esc(config.labels?.logButton||'LOG INCIDENT & CAPTURE GPS')}`}}
    }

    function exportCsv(rows,name){const fields=['id','reportType','storageSource','timeISO','station','channel','signal','quality','stability','service','receptionIndex','priority','status','engineer','lat','lng','distanceKm','ber','mer','snr','noise','comment'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[fields.join(','),...rows.map(r=>fields.map(f=>q(r[f])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`${name}-${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);logAudit('Report exported',a.download);toast('Excel-compatible report downloaded.','success')}
    function showDetail(id){const r=incidents.find(x=>x.id===id);if(!r)return;const value=(v,suffix='')=>v===null||v===undefined||String(v).trim()===''?'—':String(v)+suffix,coordinates=r.lat==null||r.lng==null?'—':`${r.lat}, ${r.lng}`,isPublic=r.reportType==='volunteer';openModal('Incident Details',`${isPublic?'<div class="content-preview" style="margin-bottom:12px"><i class="fa-solid fa-lock"></i> Public / Volunteer record — view only in Field.</div>':''}<div class="detail-grid">${[['ID',r.id],['Source',isPublic?'Public / Volunteer':'Field / Engineer'],['Storage',isPublic?'public_incidents.json':'incidents.json'],['Captured',fmtDate(r.timeISO,true)],['Station',value(r.station)],['Channel',value(r.channel)],['Reporter',value(r.engineer)],['Status',value(r.status)],['Priority',value(r.priority)],['Quality',value(r.quality)],['Stability',value(r.stability)],['Service',value(r.service)],['Reception Index',r.receptionIndex==null?'—':`${r.receptionIndex} / 100`],['Signal',value(r.signal)],['Distance',r.distanceKm==null?'—':`${r.distanceKm.toFixed(3)} km`],['Coordinates',coordinates],['Accuracy',value(r.accuracy,' m')],['BER',value(r.ber)],['MER',value(r.mer,' dB')],['SNR',value(r.snr,' dB')],['Noise',value(r.noise,' dBµV')]].map(([a,b])=>`<div class="detail-cell"><small>${esc(a)}</small><b>${esc(b)}</b></div>`).join('')}</div><div class="detail-cell" style="margin-top:10px"><small>Observation</small><b>${esc(r.comment||'No comment')}</b></div>${Object.keys(r.custom||{}).length?`<h3>Additional details</h3><div class="detail-grid">${Object.entries(r.custom).map(([k,v])=>`<div class="detail-cell"><small>${esc((config.customFields||[]).find(f=>f.id===k)?.label||k)}</small><b>${esc(v)}</b></div>`).join('')}</div>`:''}`)}

    function openCalendar(value,onPick){let cursor=value?new Date(value+'T12:00:00'):new Date();const selected=value||'';const draw=()=>{const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),names=['S','M','T','W','T','F','S'];let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10);cells+=`<button class="cal-day ${d.getMonth()!==m?'out':''} ${iso===new Date().toISOString().slice(0,10)?'today':''} ${iso===selected?'selected':''}" data-date="${iso}" title="Choose ${iso}">${d.getDate()}</button>`}openModal('Choose Date',`<div class="calendar"><div class="cal-toolbar"><button class="btn btn-sm" id="calPrev" data-tip="Previous month" title="Previous month"><i class="fa-solid fa-chevron-left"></i></button><b>${cursor.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button class="btn btn-sm" id="calNext" data-tip="Next month" title="Next month"><i class="fa-solid fa-chevron-right"></i></button></div><div class="cal-grid">${names.map(n=>`<span class="cal-week">${n}</span>`).join('')}${cells}</div><button class="btn" id="calClear" style="margin-top:12px" data-tip="Clear selected date" title="Clear date">Clear Date</button></div>`);document.getElementById('calPrev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);draw()};document.getElementById('calNext').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);draw()};document.querySelectorAll('.cal-day').forEach(b=>b.onclick=()=>{closeModal();onPick(b.dataset.date)});document.getElementById('calClear').onclick=()=>{closeModal();onPick('')}};draw()}
    function toggleDropdown(which){const n=document.getElementById('notificationsDrop'),p=document.getElementById('profileDrop');if(which==='notifications'){p.classList.add('hidden');n.classList.toggle('hidden');n.innerHTML=`<div class="drop-head">Notifications</div>${incidents.filter(x=>x.status==='Open').slice(0,3).map(x=>`<button class="drop-item" data-id="${esc(x.id)}"><i class="fa-solid fa-triangle-exclamation"></i><span><b>${esc(x.priority)} incident</b><small>${esc(x.station)} • ${esc(x.id)}</small></span></button>`).join('')||'<div class="empty">No new notifications</div>'}`;n.querySelectorAll('.drop-item').forEach(b=>b.onclick=()=>{n.classList.add('hidden');showDetail(b.dataset.id)})}else{n.classList.add('hidden');p.classList.toggle('hidden');p.innerHTML=`<div class="drop-head">Field Logger<small style="display:block;color:var(--muted);margin-top:4px">Engineer workflow</small></div><button class="drop-item" onclick="navigateTo('settings')"><i class="fa-solid fa-gear"></i><span><b>Field Settings</b><small>Appearance and device preferences</small></span></button>`}}
    window.toggleDropdown=toggleDropdown;window.navigateTo=v=>{view=v;document.querySelectorAll('.dropdown').forEach(x=>x.classList.add('hidden'));render()};
    function toggleSidebar(force){const s=document.getElementById('sidebar'),o=document.getElementById('sideOverlay'),open=force===undefined?!s.classList.contains('open'):force;s.classList.toggle('open',open);o.classList.toggle('open',open)}window.toggleSidebar=toggleSidebar;
    function logAudit(action,detail){audit.unshift({id:'AUD-'+Date.now(),timeISO:new Date().toISOString(),actor:config.brand.operator||'Field Operator',action,detail});audit=audit.slice(0,100);api('/audit',{method:'POST',body:{category:'Field GUI',action,detail}}).catch(()=>{})}
    function broadcastState(type='CONFIG_CHANGED'){try{const bc=new BroadcastChannel('mbiIncidentLogger');bc.postMessage({type,config,version:serverVersion});bc.close()}catch{}try{const bc2=new BroadcastChannel('mbiIncidentLoggerAdmin');bc2.postMessage({type});bc2.close()}catch{}if(window.opener)window.opener.postMessage({type:'MBI_FIELD_STATE'},'*')}
    function hydrateTooltips(root=document){root.querySelectorAll('button:not([data-tip])').forEach(b=>{const label=(b.title||b.getAttribute('aria-label')||b.textContent||'Action').trim().replace(/\s+/g,' ');b.dataset.tip=label;if(!b.title)b.title=label})}
    function toast(message,type=''){return UnifiedUI.toast(message,type||'info')}
    function connection(){const el=document.getElementById('onlinePill');el.innerHTML=`<span class="online-dot" style="background:${navigator.onLine?'#08ad58':'#ef3e3a'}"></span><span>${navigator.onLine?'Online':'Offline'}</span>`;if(navigator.onLine&&config?.settings?.autoSync&&incidents?.some(x=>!x.synced))syncAll()}
    window.addEventListener('online',()=>{connection();refreshConfig(true);refreshIncidents(['dashboard','history','map','sync','reports'].includes(view))});
    window.addEventListener('offline',connection);
    function applyIncomingConfig(incoming,version,serverCfg){if(!incoming||typeof incoming!=='object')return;if(view==='new')saveDraft();if(serverCfg&&typeof serverCfg==='object'){serverConfigBase=serverCfg;config=serverToUi(serverConfigBase)}else{config=merge(DEFAULT_CONFIG,incoming);const stationSource=Array.isArray(config.stations)?config.stations:[];config.stations=[...new Set(stationSource.filter(x=>typeof x==='string'||x?.enabled!==false).map(x=>typeof x==='string'?x:x?.name).filter(Boolean))];config.channels=[...new Set((config.channels||[]).map(x=>String(x?.name??x??'').trim()).filter(Boolean))];config=normalizeFieldChoiceSets(config,incoming?.choiceSets?.field)}if(Number.isFinite(Number(version)))serverVersion=Number(version);applyConfig();normalizeDraft();render();toast('Administrator changes applied.','success')}
    window.addEventListener('message',e=>{if(e.data?.type==='MBI_SYNC_STATE'){if(e.data.config)applyIncomingConfig(e.data.config,e.data.version,e.data.serverConfig)}else if(e.data?.type==='MBI_REQUEST_STATE')refreshConfig(true)});
    try{const bc=new BroadcastChannel('mbiIncidentLogger');bc.onmessage=e=>{if(['config','CONFIG_CHANGED'].includes(e.data?.type)){if(e.data.config)applyIncomingConfig(e.data.config,e.data.version,e.data.serverConfig)}}}catch{}
    document.addEventListener('click',e=>{if(!e.target.closest('.notify-wrap')&&!e.target.closest('.profile-wrap'))document.querySelectorAll('.dropdown').forEach(x=>x.classList.add('hidden'))});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.querySelectorAll('.dropdown').forEach(x=>x.classList.add('hidden'));toggleSidebar(false)}});window.addEventListener('beforeunload',()=>{if(gpsWatchId!=null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatchId)});
    window.addEventListener('mbi:themechange',()=>{const button=document.getElementById('fieldThemeButton');if(button)button.innerHTML=`<i class="fa-solid ${document.body.classList.contains('dark')?'fa-sun':'fa-moon'}"></i>`});
    new MutationObserver(()=>hydrateTooltips()).observe(document.body,{childList:true,subtree:true});
    bootstrap().catch(e=>{console.error(e);config=clone(DEFAULT_CONFIG);incidents=[];audit=[];applyConfig();initDraft();connection();render();hydrateTooltips();toast(`Backend unavailable: ${e.message}`,'error')});
    setInterval(()=>refreshConfig(false),5000);
    setInterval(()=>refreshIncidents(['dashboard','history','map','sync','reports'].includes(view)),15000);
    if(window.opener)window.opener.postMessage({type:'MBI_FIELD_READY'},'*');
  })();
  </script>
</body>
</html>
