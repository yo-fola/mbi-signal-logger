    function renderForm(){const fs=config.customFields||[];return`${pageHead('Form Builder','Add data fields to the incident form and change them at any time.',`<button class="btn btn-primary" data-action="field-add" data-tip="Add a custom incident field" title="Add field"><i class="fa-solid fa-plus"></i>Add Field</button>`)}<section class="card panel"><h2 class="panel-title"><span><i class="fa-solid fa-clipboard-list"></i>Custom Fields</span><small class="hint">${fs.length} configured</small></h2>${fs.length?`<div class="manager-list">${fs.map((f,i)=>`<div class="manager-row"><span class="drag"><i class="fa-solid ${f.type==='textarea'?'fa-align-left':f.type==='select'?'fa-list-check':f.type==='checkbox'?'fa-square-check':f.type==='date'?'fa-calendar':'fa-i-cursor'}"></i></span><div class="row-title"><b>${esc(f.label)} ${f.required?'<span style="color:var(--danger)">*</span>':''}</b><small>${esc(f.type)}${f.options?' • '+esc(String(f.options)):''}</small></div><div class="row-title"><b>${esc(f.id)}</b><small>${esc(f.placeholder||'No placeholder')}</small></div><button class="toggle ${f.enabled!==false?'on':''}" data-toggle-field="${esc(f.id)}" data-tip="Show or hide ${esc(f.label)}" title="Toggle field"><span></span></button><div class="move-actions"><button class="btn btn-sm btn-icon" data-move-field="${esc(f.id)}:-1" data-tip="Move up" title="Move up"><i class="fa-solid fa-arrow-up"></i></button><button class="btn btn-sm btn-icon" data-move-field="${esc(f.id)}:1" data-tip="Move down" title="Move down"><i class="fa-solid fa-arrow-down"></i></button><button class="btn btn-sm btn-icon" data-edit-field="${esc(f.id)}" data-tip="Edit field" title="Edit"><i class="fa-solid fa-pen"></i></button><button class="btn btn-sm btn-icon" data-delete-field="${esc(f.id)}" data-tip="Delete field" title="Delete"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}</div>`:`<div class="empty"><i class="fa-solid fa-clipboard-question"></i><b>No custom fields yet</b>Add text, number, select, checkbox, date, or textarea fields.</div>`}</section><section class="card panel"><h2 class="panel-title"><span><i class="fa-solid fa-pen-to-square"></i>Primary Action</span></h2><div class="form-grid"><div class="field span-2"><label>Submit button text</label><input id="logButtonLabel" class="control" value="${esc(config.labels.logButton||'LOG INCIDENT & CAPTURE GPS')}"></div><div class="field"><label>Engineer label</label><input id="assignmentLabel" class="control" value="${esc(config.labels.assignment||'Engineer / Operator')}"></div><div class="field"><label>Recent history title</label><input id="historyLabel" class="control" value="${esc(config.labels.recentHistory||'Recent Incident History')}"></div></div><div class="inline-actions" style="margin-top:12px"><button class="btn btn-primary" data-action="save-labels" data-tip="Publish these form labels" title="Save labels"><i class="fa-solid fa-check"></i>Save Labels</button></div></section>${footer()}`}
    function renderChoiceSets(){const sets=[['qualityOptions','Signal quality'],['stabilityOptions','Signal stability'],['serviceOptions','Service condition'],['priorities','Priorities'],['statuses','Incident statuses']];return`<section class="card panel"><h2 class="panel-title"><span><i class="fa-solid fa-list-check"></i>Choice Sets</span><small class="hint">One option per line</small></h2><div class="form-grid">${sets.map(([id,label])=>`<div class="field"><label>${label}</label><textarea id="choices-${id}" class="control">${esc((config[id]||[]).join('\n'))}</textarea></div>`).join('')}</div><div class="inline-actions" style="margin-top:12px"><button class="btn btn-primary" onclick="saveChoiceSets()" data-tip="Publish choices to both reporting forms" title="Save choice sets"><i class="fa-solid fa-check"></i>Save Choice Sets</button></div><p class="hint">Quality, stability, and service choices publish to Public and Field. Priorities and statuses apply to the technical Field workflow.</p></section>`}
    window.saveChoiceSets=()=>{const keys=['qualityOptions','stabilityOptions','serviceOptions','priorities','statuses'];for(const key of keys){let values=document.getElementById('choices-'+key).value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);if(!values.length)return toast('Every choice set needs at least one option.','error');values=[...new Set(values)];if(key==='priorities'){const canonical=['Auto','Major','Minor','Critical'];values=[...canonical,...values.filter(x=>!canonical.some(c=>c.toLowerCase()===x.toLowerCase()))]}config[key]=values}config.choiceSets=buildChoiceSetsFromLegacy(config);saveConfig('Reporting choice sets updated','Quality, stability, service, priorities, statuses, colors, text colors, and Public scores');render();toast('Choice sets published to Public and Field.','success')};
    function renderStationManager(){const list=config.stations||[];return`${pageHead('Stations','Manage backend reference data used for distance, nominal EIRP, and future calibrated coverage calculations.',`<button class="btn btn-primary" data-add-station data-tip="Add station" title="Add Station"><i class="fa-solid fa-plus"></i>Add Station</button>`)}<section class="card panel"><h2 class="panel-title"><span><i class="fa-solid fa-map-location-dot"></i>Configured Stations</span><small class="hint">${list.length} total</small></h2><div class="manager-list">${list.map((s,i)=>{const complete=s.latitude!=null&&s.longitude!=null&&s.rfPower!=null&&s.rfPowerUnit&&s.towerHeightFt!=null&&s.antennaGainDb!=null,eirp=s.nominalEirp;return`<div class="manager-row" style="grid-template-columns:34px minmax(0,1fr) auto"><span class="drag"><i class="fa-solid fa-map-location-dot"></i></span><div><b>${esc(s.name)}</b><div class="hint">${esc(s.id)} • ${s.latitude==null||s.longitude==null?'Coordinates pending':`${Number(s.latitude).toFixed(6)}, ${Number(s.longitude).toFixed(6)}`} • ${complete?`${s.rfPower} ${esc(s.rfPowerUnit)}, ${s.towerHeightFt} ft, ${s.antennaGainDb} dB`:'Legacy reference — complete when edited'}${eirp?` • Nominal EIRP ${Number(eirp.eirpKw).toFixed(3)} kW / ${Number(eirp.eirpDbw).toFixed(3)} dBW`:''} • ${s.enabled===false?'Disabled':'Enabled'}</div></div><div class="move-actions"><button class="btn btn-sm btn-icon" data-move-station="${i}:-1" title="Move up"><i class="fa-solid fa-arrow-up"></i></button><button class="btn btn-sm btn-icon" data-move-station="${i}:1" title="Move down"><i class="fa-solid fa-arrow-down"></i></button><button class="btn btn-sm btn-icon" data-edit-station="${i}" title="Edit station"><i class="fa-solid fa-pen"></i></button><button class="btn btn-sm btn-icon" data-delete-station="${i}" title="Delete station"><i class="fa-solid fa-trash"></i></button></div></div>`}).join('')||'<div class="empty"><i class="fa-solid fa-map-location-dot"></i><b>No stations configured</b>Add the first transmitting station.</div>'}</div></section>${footer()}`}
    function renderListManager(kind){const list=config[kind]||[],singular='Channel',icon='fa-tower-broadcast';return`${pageHead('Channels',`Manage the channels available on both reporting forms.`,`<button class="btn btn-primary" data-add-list="${kind}" title="Add ${singular}"><i class="fa-solid fa-plus"></i>Add ${singular}</button>`)}<section class="card panel"><h2 class="panel-title"><span><i class="fa-solid ${icon}"></i>Active Channels</span><small class="hint">${list.length} total</small></h2><div class="manager-list">${list.map((x,i)=>`<div class="manager-row" style="grid-template-columns:34px 1fr auto"><span class="drag"><i class="fa-solid ${icon}"></i></span><input class="control" value="${esc(x)}" data-list-value="${kind}:${i}" aria-label="${singular} name"><div class="move-actions"><button class="btn btn-sm btn-icon" data-move-list="${kind}:${i}:-1" title="Move up"><i class="fa-solid fa-arrow-up"></i></button><button class="btn btn-sm btn-icon" data-move-list="${kind}:${i}:1" title="Move down"><i class="fa-solid fa-arrow-down"></i></button><button class="btn btn-sm btn-icon" data-delete-list="${kind}:${i}" title="Delete"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}</div></section>${footer()}`}
    function filteredIncidents(){return incidents.filter(x=>inRange(x)&&(!incidentFilter.q||Object.values(x).join(' ').toLowerCase().includes(incidentFilter.q.toLowerCase()))&&(incidentFilter.status==='All'||x.status===incidentFilter.status)&&(incidentFilter.priority==='All'||x.priority===incidentFilter.priority)&&(incidentFilter.source==='All'||(incidentFilter.source==='Public'&&x.reportType==='volunteer')||(incidentFilter.source==='Field'&&x.reportType!=='volunteer'))).sort((a,b)=>(Date.parse(b.timeISO)||0)-(Date.parse(a.timeISO)||0))}
    function renderIncidents(historyOnly=false){
      const state=endpointState.incidents,ready=state.loaded,rows=ready?filteredIncidents():[],source=sourceLabel('incidents');

    }

    function validAdminMapPoint(r){return r&&Number.isFinite(Number(r.lat))&&Number.isFinite(Number(r.lng))&&Number(r.lat)>=-90&&Number(r.lat)<=90&&Number(r.lng)>=-180&&Number(r.lng)<=180}
    function adminMappedRows(){
      const today=dateKey(new Date());
      return incidents.filter(validAdminMapPoint).filter(r=>{
        if(adminMapFilter.source==='Field'&&r.reportType==='volunteer')return false;
        if(adminMapFilter.source==='Public'&&r.reportType!=='volunteer')return false;
        if(adminMapFilter.station!=='All'&&r.station!==adminMapFilter.station)return false;
        if(adminMapFilter.status!=='All'&&r.status!==adminMapFilter.status)return false;
        const day=String(r.timeISO||'').slice(0,10);
        if(adminMapFilter.date==='Today'&&day!==today)return false;
        if(adminMapFilter.date==='Current Range'&&(!day||day<range.from||day>range.to))return false;
        return true;
      }).sort((a,b)=>(Date.parse(b.timeISO)||0)-(Date.parse(a.timeISO)||0));
    }
    function adminIncidentTarget(r){return validAdminMapPoint(r)?{id:r.id,lat:Number(r.lat),lng:Number(r.lng),timeISO:r.timeISO||'',station:r.station||'',channel:r.channel||'',reportType:r.reportType||'engineer'}:null}
    function ensureAdminMapTarget(rows=adminMappedRows()){
      if(adminMapTarget){const current=rows.find(r=>r.id===adminMapTarget.id);adminMapTarget=current?adminIncidentTarget(current):null}
      if(!adminMapTarget)adminMapTarget=adminIncidentTarget(rows[0]);
      return adminMapTarget;
    }
    function adminMapSrc(target){return target?`https://www.google.com/maps?q=${encodeURIComponent(target.lat+','+target.lng)}&z=15&output=embed`:'about:blank'}
    function adminMapExternalHref(target){return target?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(target.lat+','+target.lng)}`:'#'}
    function adminMapTargetText(target){if(!target)return'No incident with valid GPS coordinates matches the current filters.';const row=incidents.find(r=>r.id===target.id);return`Showing ${target.id}${row?.reportType==='volunteer'?' • Public':' • Field'}${target.station?` • ${target.station}`:''}${target.timeISO?` • ${fmt(target.timeISO,false)}`:''}`}
    function syncAdminMapTarget(target,announce=''){
      adminMapTarget=target;
      const frame=document.getElementById('adminGoogleMap'),link=document.getElementById('adminOpenGoogleMaps'),summary=document.getElementById('adminMapTargetSummary');
      if(frame)frame.src=adminMapSrc(target);
      if(link){link.href=adminMapExternalHref(target);link.classList.toggle('disabled',!target);link.setAttribute('aria-disabled',target?'false':'true')}
      if(summary)summary.textContent=adminMapTargetText(target);
      document.querySelectorAll('[data-action="admin-focus-map"]').forEach(b=>b.closest('.admin-map-item')?.classList.toggle('active',target&&b.dataset.id===target.id));
      if(announce)toast(announce,'success');
    }
    function renderAdminLiveMap(){
      const state=endpointState.incidents,ready=state.loaded,rows=ready?adminMappedRows():[],target=ready?ensureAdminMapTarget(rows):null;
      const stations=['All',...uniqueStrings(incidents.filter(validAdminMapPoint).map(r=>r.station).filter(Boolean))];
      const source=sourceLabel('incidents'),publicCount=rows.filter(r=>r.reportType==='volunteer').length,fieldCount=rows.length-publicCount;
      const filterNote=adminMapFilter.date==='Current Range'?`${prettyDate(range.from)} – ${prettyDate(range.to)}`:adminMapFilter.date;

      if(!ready)return`${pageHead('Live Map','Combined Public + Field incident locations',pageActions)}<section class="card panel">${chartEmpty('Incident location data unavailable')}</section>${footer()}`;

          <div class="field"><label>Status</label><select id="adminMapStatus" class="control"><option ${adminMapFilter.status==='All'?'selected':''}>All</option>${config.statuses.map(x=>`<option ${adminMapFilter.status===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
          <div class="field"><label>Date</label><select id="adminMapDate" class="control">${['All','Today','Current Range'].map(x=>`<option ${adminMapFilter.date===x?'selected':''}>${x}</option>`).join('')}</select></div>
        </div>
        <div class="inline-actions" style="margin-top:10px">
          <button class="btn btn-sm" data-action="calendar-range" data-tip="Choose the Current Range dates" title="Choose date range"><i class="fa-regular fa-calendar"></i>${prettyDate(range.from)} - ${prettyDate(range.to)}</button>
          <button class="btn btn-sm btn-primary" data-action="admin-map-latest" ${rows.length?'':'disabled'} data-tip="Return to the newest mapped incident matching these filters" title="Show latest mapped incident"><i class="fa-solid fa-clock-rotate-left"></i>Most Recent</button>
        </div>
      </section>
      <section class="admin-map-layout">
        <div class="card panel admin-map-canvas">
          <div class="admin-map-actions">
            <div id="adminMapTargetSummary" class="admin-map-target-summary">${esc(adminMapTargetText(target))}</div>
            <a id="adminOpenGoogleMaps" class="btn btn-sm ${target?'':'disabled'}" target="_blank" rel="noopener" aria-disabled="${target?'false':'true'}" href="${adminMapExternalHref(target)}" data-tip="Open the currently displayed incident in Google Maps" title="Open Google Maps"><i class="fa-brands fa-google"></i>Open Google Maps</a>
          </div>
          <iframe id="adminGoogleMap" class="admin-map-frame" title="Google Map showing incident location" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${adminMapSrc(target)}"></iframe>
        </div>
        <aside class="card admin-map-list">
          <div class="admin-map-list-head"><h2 class="panel-title"><span><i class="fa-solid fa-map-pin"></i>Mapped Incidents</span><small>${rows.length}</small></h2></div>
          <div class="admin-map-scroll">
            ${rows.length?rows.map(r=>`<article class="admin-map-item ${target?.id===r.id?'active':''}">
              <button class="admin-map-focus" data-action="admin-focus-map" data-id="${esc(r.id)}" title="Show ${esc(r.id)} on map">
                <span class="admin-map-item-top"><b>${esc(r.id)}</b><span class="admin-map-source ${r.reportType==='volunteer'?'public':'field'}">${r.reportType==='volunteer'?'Public':'Field'}</span></span>
                <small>${esc(r.station||'—')}${r.channel?` / ${esc(r.channel)}`:''}</small>
                <small>${[r.quality,r.stability,r.service].filter(Boolean).map(esc).join(' • ')||'No observation labels'}</small>

    function renderExports(){

        ['Calculated / Captured Signal',kmlValue(row.signal)],
        ['Distance from Station',row.distanceKm===null||row.distanceKm===undefined||!Number.isFinite(Number(row.distanceKm))?'—':`${Number(row.distanceKm).toFixed(3)} km`],
        ['GPS Accuracy',Number.isFinite(Number(row.accuracy))?`±${Number(row.accuracy).toFixed(1)} m`:'—'],
        ['Reporter',kmlValue(row.engineer||row.reporterName)],
        ['Status',kmlValue(row.status)],
        ['Priority',kmlValue(row.priority)],
        ['Quality',kmlValue(row.quality)],
        ['Quality Score',kmlScore(row.qualityScore,row.qualityMax)],
        ['Stability',kmlValue(row.stability)],
        ['Stability Score',kmlScore(row.stabilityScore,row.stabilityMax)],
        ['Service',kmlValue(row.service)],
        ['Observation',kmlValue(row.comment)],
        ['Service Score',kmlScore(row.serviceScore,row.serviceMax)],
        ['Reception Experience Index',row.receptionIndex===null||row.receptionIndex===undefined||!Number.isFinite(Number(row.receptionIndex))?'—':`${Number(row.receptionIndex).toFixed(1)} / 100`],
        ['Live GPS Latitude',Number(row.lat).toFixed(8)],
        ['Live GPS Longitude',Number(row.lng).toFixed(8)]
      ];

      const incidentExtendedRows=row=>[
        ['ID',row.id],['Captured',row.timeISO],['Report Type',kmlReportType(row)],
        ['Station',row.station],['Channel',row.channel],['Calculated / Captured Signal',row.signal],
        ['Distance from Station',row.distanceKm===null||row.distanceKm===undefined||!Number.isFinite(Number(row.distanceKm))?'':`${Number(row.distanceKm).toFixed(3)} km`],['GPS Accuracy',Number.isFinite(Number(row.accuracy))?`±${Number(row.accuracy).toFixed(1)} m`:''],['Reporter',row.engineer||row.reporterName],['Status',row.status],['Priority',row.priority],
        ['Quality',row.quality],['Quality Score',row.qualityScore],['Quality Score Max',row.qualityMax],['Stability',row.stability],['Stability Score',row.stabilityScore],['Stability Score Max',row.stabilityMax],
        ['Service',row.service],['Observation',row.comment],['Service Score',row.serviceScore],['Service Score Max',row.serviceMax],['Reception Experience Index',row.receptionIndex],
        ['Live GPS Latitude',row.lat],['Live GPS Longitude',row.lng]
      ];

      const incidentPlacemark=row=>`<Placemark><name>${xmlEscape(row.id||'Incident')}</name><styleUrl>#incidentPoint</styleUrl><description><![CDATA[${kmlCdata(kmlTable(incidentRows(row)))}]]></description><ExtendedData>${kmlExtendedData(incidentExtendedRows(row))}</ExtendedData><Point><coordinates>${Number(row.lng).toFixed(8)},${Number(row.lat).toFixed(8)},0</coordinates></Point></Placemark>`;

      const stationPlacemark=(stationName,items)=>{
        const station=stationForKml(stationName);
        if(!station||!validStationKmlCoordinate(station))return'';
        const eirp=deriveStationKmlEirp(station),car=deriveStationKmlCarRadius(station,eirp),flags=stationKmlFlags(station,eirp,car);
        const associatedLocations=items.map(row=>`${row.id||'Incident'}: ${Number(row.lat).toFixed(6)}, ${Number(row.lng).toFixed(6)}`).join(' | ');
        const stationRows=[
          ['Station',kmlValue(station.name)],
          ['Station ID',kmlValue(station.id)],
          ['Station Latitude',Number(station.latitude).toFixed(8)],
          ['Station Longitude',Number(station.longitude).toFixed(8)],
          ['RF Power',stationRfPowerWatts(station)===null?'—':`${Number(stationRfPowerWatts(station).toFixed(3)).toLocaleString()} W`],
          ['Tower Height',station.towerHeightFt===null||station.towerHeightFt===undefined?'—':`${station.towerHeightFt} ft`],
          ['Antenna Gain',station.antennaGainDb===null||station.antennaGainDb===undefined?'—':`${station.antennaGainDb} dB`],
          ['Nominal EIRP',eirp?`${eirp.eirpKw.toFixed(3)} kW`:'—'],
          ['Broadcast Frequency',station.frequencyMHz===null||station.frequencyMHz===undefined?'—':`${station.frequencyMHz} MHz`],
          ['Ideal Car Reception Radius',car?`${car.distanceKm.toFixed(3)} km`:'—'],
          ['Analytical Flags',flags.join('; ')],
          ['Associated Incident Count',String(items.length)]
        ];
        const incidentLocationSection=items.length?`<br><h3>Associated Incident Locations</h3><table border="1" cellpadding="4" cellspacing="0"><tr><th>ID</th><th>Type</th><th>Latitude</th><th>Longitude</th></tr>${items.map(row=>`<tr><td>${htmlEscape(row.id||'Incident')}</td><td>${htmlEscape(kmlReportType(row))}</td><td>${Number(row.lat).toFixed(8)}</td><td>${Number(row.lng).toFixed(8)}</td></tr>`).join('')}</table>`:'';
        const description=kmlTable(stationRows)+incidentLocationSection;
        const extendedRows=[
          ['Station',station.name],['Station ID',station.id],['Station Latitude',station.latitude],['Station Longitude',station.longitude],['RF Power',stationRfPowerWatts(station)===null?'':`${Number(stationRfPowerWatts(station).toFixed(3))} W`],
          ['Tower Height Ft',station.towerHeightFt],['Antenna Gain dB',station.antennaGainDb],['Nominal EIRP kW',eirp?.eirpKw],['Nominal EIRP dBW',eirp?.eirpDbw],['Nominal EIRP dBm',eirp?.eirpDbm],
          ['Broadcast Frequency MHz',station.frequencyMHz],['Ideal Car Reception Radius Km',car?.distanceKm],['Ideal Car Sensitivity dBm',station.idealCarSensitivityDbm],['Ideal Car Model',car?.modelVersion],['Radio Horizon Km',car?.radioHorizonDistanceKm],['Free-space Sensitivity Ceiling Km',car?.freeSpaceSensitivityDistanceKm],['Car Antenna Height m',car?.receiverHeightM],['Ideal Car Limiting Factor',car?.limitingFactor],['Analytical Flags',flags.join('; ')],
          ['Associated Incident Count',items.length],['Associated Incident Locations',associatedLocations]
        ];
        return`<Placemark><name>${xmlEscape(`Station — ${station.name}`)}</name><styleUrl>#stationPoint</styleUrl><description><![CDATA[${kmlCdata(description)}]]></description><ExtendedData>${kmlExtendedData(extendedRows)}</ExtendedData><Point><coordinates>${Number(station.longitude).toFixed(8)},${Number(station.latitude).toFixed(8)},0</coordinates></Point></Placemark>`;
      };

      let stationPointCount=0;
      const folders=[...groups.entries()].map(([stationName,items])=>{
        const stationMark=stationPlacemark(stationName,items);
        if(stationMark)stationPointCount++;
        return`<Folder><name>${xmlEscape(stationName)}</name>${stationMark}${items.map(incidentPlacemark).join('')}</Folder>`;
      }).join('');

      const kml=`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${xmlEscape(`MBI Incident Report — ${periodCaption()}`)}</name><description>${xmlEscape(`${mapped.length} mapped report${mapped.length===1?'':'s'} and ${stationPointCount} configured station point${stationPointCount===1?'':'s'} exported from the Admin filtered report view.`)}</description><Style id="incidentPoint"><IconStyle><scale>1.1</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/blu-circle.png</href></Icon></IconStyle><LabelStyle><scale>0.8</scale></LabelStyle></Style><Style id="stationPoint"><IconStyle><scale>1.35</scale><Icon><href>http://maps.google.com/mapfiles/kml/paddle/red-circle.png</href></Icon></IconStyle><LabelStyle><scale>1.0</scale></LabelStyle></Style>${folders}</Document></kml>`;

      download(kml,`${name}-${new Date().toISOString().slice(0,10)}.kml`,'application/vnd.google-earth.kml+xml;charset=utf-8');
      log('Report exported',`KML • ${mapped.length} incidents • ${stationPointCount} stations${skipped?` • ${skipped} skipped without GPS`:''}`);
      toast(`Google Earth KML downloaded with ${mapped.length} incident location${mapped.length===1?'':'s'} and ${stationPointCount} station point${stationPointCount===1?'':'s'}${skipped?`; ${skipped} incident${skipped===1?' was':'s were'} skipped without valid GPS`:''}.`,'success');
    }

        for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=dateKey(d),inrange=temp.from&&temp.to&&iso>=temp.from&&iso<=temp.to;days+=`<button class="cal-day ${d.getMonth()!==m?'out':''} ${iso===dateKey(new Date())?'today':''} ${inrange?'inrange':''} ${iso===temp.from||iso===temp.to?'selected':''}" data-date="${iso}" title="Choose ${iso}">${d.getDate()}</button>`}
        openModal('Choose Date Range',`<div class="calendar-summary"><button id="pickFrom" class="date-box" style="border-color:${selecting==='from'?'var(--primary)':''}"><small>Start date</small><b>${temp.from?prettyDate(temp.from):'Choose'}</b></button><button id="pickTo" class="date-box" style="border-color:${selecting==='to'?'var(--primary)':''}"><small>End date</small><b>${temp.to?prettyDate(temp.to):'Choose'}</b></button></div><div class="calendar" style="margin-top:14px"><div class="cal-toolbar"><button id="calPrev" class="btn btn-sm btn-icon" data-tip="Previous month" title="Previous month"><i class="fa-solid fa-chevron-left"></i></button><b>${cursor.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button id="calNext" class="btn btn-sm btn-icon" data-tip="Next month" title="Next month"><i class="fa-solid fa-chevron-right"></i></button></div><div class="cal-grid">${weeks.map(x=>`<span class="cal-week">${x}</span>`).join('')}${days}</div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button id="rangeApply" class="btn btn-primary">Apply Range</button>`);
        document.getElementById('pickFrom').onclick=()=>{selecting='from';draw()};document.getElementById('pickTo').onclick=()=>{selecting='to';draw()};document.getElementById('calPrev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);draw()};document.getElementById('calNext').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);draw()};document.querySelectorAll('.cal-day').forEach(b=>b.onclick=()=>{if(selecting==='from'){temp.from=b.dataset.date;if(temp.to&&temp.to<temp.from)temp.to=temp.from;selecting='to'}else{temp.to=b.dataset.date;if(temp.from&&temp.to<temp.from)[temp.from,temp.to]=[temp.to,temp.from]}draw()});
        document.getElementById('rangeApply').onclick=()=>{if(!temp.from||!temp.to)return toast('Choose both dates.','error');range={...temp,active:true};chartPeriod='Custom Range';closeModal();render();toast('Dashboard date range updated.','success')};
      };
      draw();
    }
    function testGps(){let target=document.getElementById('gpsResult');if(!target){openModal('GPS Capture','<div id="gpsResult" class="content-preview"><i class="fa-solid fa-spinner fa-spin"></i> Requesting a high-accuracy position…</div>','<button class="btn" onclick="closeModal()">Close</button>');target=document.getElementById('gpsResult')}else target.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Requesting a high-accuracy position…';const done=position=>{const lat=position.coords.latitude,lng=position.coords.longitude,acc=position.coords.accuracy,t=document.getElementById('gpsResult');if(t)t.innerHTML=`<b>GPS lock acquired</b><br>Latitude: ${Number(lat).toFixed(6)} • Longitude: ${Number(lng).toFixed(6)} • Accuracy: ±${Math.round(Number(acc))} m`;toast('GPS test successful.','success')},failed=error=>{const permission=error?.code===1,t=document.getElementById('gpsResult'),message=permission?'Location permission is required.':'A live GPS position is unavailable.';if(t)t.innerHTML=`<b>${permission?'GPS permission required':'GPS unavailable'}</b><br>${message}`;toast(message,'error')};if(navigator.geolocation)navigator.geolocation.getCurrentPosition(done,failed,{enableHighAccuracy:true,timeout:Number(config.gps.timeout)||10000,maximumAge:Number(config.gps.maximumAge)||0});else failed({code:0})}
    function toggleTheme(){UnifiedUI.toggleMode()}window.toggleTheme=toggleTheme;
    function toggleDrop(which){
      const n=document.getElementById('notificationDrop'),p=document.getElementById('profileDrop');
      if(which==='notifications'){
        p.classList.add('hidden');n.classList.toggle('hidden');
        const state=endpointState.incidents,active=state.loaded?incidents.filter(x=>x.status&&!['Closed','Resolved'].includes(x.status)).slice(0,5):[];
        const noticeBody=!state.loaded?'<div class="empty">Notifications unavailable</div>':active.map(x=>`<button class="drop-item" data-open-id="${esc(x.id)}"><i class="fa-solid fa-triangle-exclamation"></i><span><b>${esc(x.priority||'Incident')} incident</b><small>${esc(x.station||'—')} • ${esc(x.id||'—')}</small></span></button>`).join('')||'<div class="empty">No new notifications</div>';
        n.innerHTML=`<div class="drop-head">Notifications<small style="display:block;color:var(--muted);margin-top:3px">${esc(sourceLabel('incidents'))}</small></div>${noticeBody}`;
        n.querySelectorAll('[data-open-id]').forEach(b=>b.onclick=()=>{n.classList.add('hidden');showIncident(b.dataset.openId)});
      }else{
        n.classList.add('hidden');p.classList.toggle('hidden');
        const ready=endpointState.config.loaded,operator=ready?(config.brand.operator||config.brand.name||'Configured user'):'Unavailable',role=ready?(config.brand.role||'Configured role'):'Configuration';
        p.innerHTML=`<div class="drop-head">${esc(operator)}<small style="display:block;color:var(--muted);margin-top:3px">${esc(role)}</small></div><button class="drop-item" onclick="navigateAdmin('system')"><i class="fa-solid fa-user-gear"></i><span><b>Profile & Settings</b><small>Brand and profile preferences</small></span></button><button class="drop-item" onclick="openLiveApp()"><i class="fa-solid fa-display"></i><span><b>View Live App</b><small>Open the field incident logger</small></span></button>`;
      }
    }window.toggleDrop=toggleDrop;window.navigateAdmin=go;
    function toggleSidebar(force){const s=document.getElementById('sidebar'),o=document.getElementById('sideOverlay'),open=force===undefined?!s.classList.contains('open'):force;s.classList.toggle('open',open);o.classList.toggle('open',open)}window.toggleSidebar=toggleSidebar;
    function search(q){const out=document.getElementById('searchResults');q=q.trim().toLowerCase();if(q.length<2){out.classList.add('hidden');return}const rs=[...incidents.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)).slice(0,5).map(x=>({type:'incident',title:x.id,sub:x.station,icon:'fa-triangle-exclamation',id:x.id})),...config.stations.filter(x=>`${x.id} ${x.name}`.toLowerCase().includes(q)).slice(0,3).map(x=>({type:'station',title:x.name,sub:x.id,icon:'fa-map-location-dot'})),...users.filter(x=>`${x.name} ${x.email} ${x.role}`.toLowerCase().includes(q)).slice(0,3).map(x=>({type:'user',title:x.name,sub:x.role,icon:'fa-user'}))];out.innerHTML=rs.length?rs.map((r,i)=>`<button class="search-result" data-result="${i}"><i class="fa-solid ${r.icon}"></i><span><b>${esc(r.title)}</b><small>${esc(r.sub)}</small></span></button>`).join(''):`<div class="empty" style="padding:18px"><b>No results</b>Try a different search.</div>`;out.classList.remove('hidden');out.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{const r=rs[Number(b.dataset.result)];out.classList.add('hidden');if(r.type==='incident')showIncident(r.id);else go(r.type==='user'?'users':'stations')})}
    function setChartPeriod(value){if(value==='Custom Range')return;const now=new Date();chartPeriod=value;if(value==='Last 30 Days'){const from=new Date(now);from.setDate(from.getDate()-29);range={from:dateKey(from),to:dateKey(now),active:true}}else if(value==='This Year')range={from:`${now.getFullYear()}-01-01`,to:dateKey(now),active:true};else range={from:dateKey(new Date(now.getFullYear(),now.getMonth(),1)),to:dateKey(now),active:true};render();toast(`${value} statistics loaded.`,'success')}
    function openLiveApp(){liveWindow=window.open('/field/','mbiFieldApp');setTimeout(()=>{try{liveWindow?.postMessage({type:'MBI_SYNC_STATE',config,incidents,audit,users,version:serverVersion,serverConfig:serverConfigBase},'*')}catch{}},700)}window.openLiveApp=openLiveApp;
    function broadcast(payload=config,version=serverVersion,serverConfig=serverConfigBase){try{const bc=new BroadcastChannel('mbiIncidentLogger');bc.postMessage({type:'config',config:payload,version,serverConfig});bc.close()}catch{}try{liveWindow?.postMessage({type:'MBI_SYNC_STATE',config:payload,version,serverConfig},'*')}catch{}}
    function hydrateTooltips(root=document){root.querySelectorAll('button:not([data-tip])').forEach(b=>{const label=(b.title||b.getAttribute('aria-label')||b.textContent||'Action').trim().replace(/\s+/g,' ');b.dataset.tip=label;if(!b.title)b.title=label})}
    function clarifyRequiredControls(){const required=document.querySelector('[data-toggle-component="assignment"]');if(required){required.dataset.tip='Required field — cannot be hidden';required.title='Required field — cannot be hidden';required.setAttribute('aria-disabled','true')}const profile=document.getElementById('brandOperatorInput');if(profile){const label=profile.closest('.field')?.querySelector('label'),copy='Admin display profile';if(label&&label.textContent!==copy)label.textContent=copy;const subtitle=document.querySelector('.page-head p'),description='Brand, theme, Admin display, and configuration tools. Field report names remain free text.';if(subtitle&&subtitle.textContent!==description)subtitle.textContent=description}}
    function toast(message,type=''){return UnifiedUI.toast(message,type||'info')}
    document.getElementById('globalSearch').addEventListener('input',e=>search(e.target.value));
    document.addEventListener('click',e=>{const actionName=e.target.closest('[data-action]')?.dataset.action,cap=ACTION_CAP[actionName];if(cap&&!can(cap)){e.preventDefault();e.stopImmediatePropagation();toast(`${activeRole()} does not have permission for this action.`,'error')}},true);
    document.addEventListener('click',e=>{const required=e.target.closest('[data-toggle-component="assignment"]');if(required){e.preventDefault();e.stopImmediatePropagation();toast('Engineer / Operator is required and cannot be hidden.','error')}},true);
    document.addEventListener('change',e=>{if(e.target.matches('.chart-select'))setChartPeriod(e.target.value)});
    document.getElementById('importInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!incoming||typeof incoming!=='object')throw 0;const keep={stations:clone(config.stations),channels:clone(config.channels),permissions:clone(config.permissions),gps:clone(config.gps),statuses:clone(config.statuses),priorities:clone(config.priorities),users:clone(users)};const next=(incoming.system||incoming.ui)?serverToUi(incoming):normalizeUiConfig(incoming);Object.assign(next,{stations:keep.stations,channels:keep.channels,permissions:keep.permissions,gps:keep.gps,statuses:keep.statuses,priorities:keep.priorities});config=next;users=keep.users;saveConfig('UI configuration imported',file.name+' (reference data preserved)');applyTheme();render();toast('UI configuration imported. Stations, Channels, Users, Permissions and GPS were preserved.','success')}catch{toast('That configuration file is not valid JSON.','error')}};reader.readAsText(file);e.target.value=''});
    document.getElementById('publicLogoInput').addEventListener('change',e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(!/^image\/(png|jpeg|webp|svg\+xml)$/i.test(file.type))return toast('Choose a PNG, JPEG, WebP, or SVG logo.','error');if(file.size>524288)return toast('Logo must be 512 KB or smaller.','error');const reader=new FileReader();reader.onload=()=>{config.brand.logoDataUrl=String(reader.result||'');render();toast('Logo ready. Select Save & Publish to apply it to Public and Field.','success')};reader.onerror=()=>toast('The logo could not be read.','error');reader.readAsDataURL(file)});
    window.addEventListener('message',e=>{if(e.data?.type==='MBI_FIELD_READY')e.source?.postMessage({type:'MBI_SYNC_STATE',config,incidents,audit,users,version:serverVersion,serverConfig:serverConfigBase},'*');if(e.data?.type==='MBI_FIELD_STATE')refreshIncidents(view==='dashboard'||view==='incidents'||view==='history'||view==='live-map')});
    try{const bc=new BroadcastChannel('mbiIncidentLoggerAdmin');bc.onmessage=e=>{if(e.data?.type==='FIELD_INCIDENT_CHANGED')refreshIncidents(view==='dashboard'||view==='incidents'||view==='history'||view==='live-map')}}catch{}
    document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))document.getElementById('searchResults').classList.add('hidden');if(!e.target.closest('.topbar [style="position:relative"]')){document.getElementById('notificationDrop').classList.add('hidden');document.getElementById('profileDrop').classList.add('hidden')}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();toggleSidebar(false);document.querySelectorAll('.dropdown,.search-results').forEach(x=>x.classList.add('hidden'))}});
    window.addEventListener('mbi:themechange',()=>{const button=document.getElementById('themeButton');if(button)button.innerHTML=`<i class="fa-solid ${document.body.classList.contains('dark')?'fa-sun':'fa-moon'}"></i>`});
    new MutationObserver(()=>{hydrateTooltips();clarifyRequiredControls()}).observe(document.body,{childList:true,subtree:true});
    bootstrap().catch(e=>{console.error(e);config=clone(DEFAULT_CONFIG);incidents=[];audit=[];users=clone(DEFAULT_USERS);applyTheme();render();toast(`Backend unavailable: ${e.message}`,'error')});
    setInterval(()=>refreshIncidents(['dashboard','incidents','history','live-map','exports'].includes(view)),15000);
    setInterval(()=>{if(view==='audit')refreshAudit()},20000);
    setInterval(()=>refreshHealth(view==='dashboard'),30000);
  })();
  </script>
